name: Test missing config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with missing config file (expect failure)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          config_file: .github/nonexistent-config.yml
        continue-on-error: true

      - name: Assert action failed due to missing config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when config file is missing, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config file was missing"
