name: Test invalid config file schema
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file (missing required 'patterns' key)
        run: |
          mkdir -p .github
          cat > .github/files-sync-invalid.yaml << 'EOF'
          settings:
            pull_request:
              reviewers:
                - some-user
          # 'patterns' key is missing — this should fail schema validation
          EOF

      - name: Run action with invalid config (expect failure)
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/files-sync-invalid.yaml
        continue-on-error: true

      - name: Assert action failed due to invalid config schema
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid config schema, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid config schema"
