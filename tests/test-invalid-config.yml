name: Test invalid config schema error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid sync config file (missing required repositories field)
        run: |
          mkdir -p .github
          cat > .github/files-sync-config.yaml << 'EOF'
          patterns:
            - files:
                - README.md
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}

      - name: Assert action failed due to invalid config schema
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid config schema"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid config (missing repositories)"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
