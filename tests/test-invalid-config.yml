name: Test invalid config file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file (missing required 'patterns' key)
        run: |
          mkdir -p tests/fixtures/invalid-config
          cat > tests/fixtures/invalid-config/files-sync-config.yaml << 'EOF'
          settings:
            pull_request:
              disabled: true
          # 'patterns' key is required but missing — this should fail schema validation
          EOF

      - name: Run action with invalid config (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: tests/fixtures/invalid-config/files-sync-config.yaml

      - name: Assert action failed due to invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid config, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid config"
