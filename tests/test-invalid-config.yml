name: Test invalid config schema
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file (missing required patterns field)
        run: |
          mkdir -p .github
          cat > .github/files-sync-invalid.yaml << 'EOF'
          settings:
            pull_request:
              reviewers:
                - some-user
          # patterns is required but missing
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/files-sync-invalid.yaml

      - name: Assert action failed gracefully on invalid config schema
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid config schema"
          else
            echo "FAIL: expected failure but got '$OUTCOME'"
            exit 1
          fi
