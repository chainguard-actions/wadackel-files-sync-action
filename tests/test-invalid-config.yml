name: Test invalid config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create invalid config file (missing required patterns field)
        run: |
          mkdir -p tests/fixtures
          cat > tests/fixtures/invalid-config.yml << 'EOF'
          settings:
            pull_request:
              reviewers:
                - someuser
          # patterns field is missing - this is required by the schema
          EOF

      - name: Run action with invalid config file
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: tests/fixtures/invalid-config.yml

      - name: Assert action failed due to invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when config file is invalid, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when config file was invalid"
