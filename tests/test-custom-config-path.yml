name: Test custom config file path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file at a custom path
        run: |
          mkdir -p tests/fixtures/custom-path
          cat > tests/fixtures/custom-path/my-sync-config.yaml << 'EOF'
          settings:
            pull_request:
              disabled: true
          patterns: []
          EOF

      - name: Run action with custom config_file path
        id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: tests/fixtures/custom-path/my-sync-config.yaml

      - name: Assert action succeeded with custom config path
        env:
          PR_URLS: ${{ steps.action.outputs.pull_request_urls }}
          SYNCED: ${{ steps.action.outputs.synced_files }}
        run: |
          echo "pull_request_urls: $PR_URLS"
          echo "synced_files: $SYNCED"
          # With empty patterns, both outputs should be empty
          PR_NORM="$(echo "$PR_URLS" | tr -d '[:space:]')"
          SYNCED_NORM="$(echo "$SYNCED" | tr -d '[:space:]')"
          if ([ -z "$PR_NORM" ] || [ "$PR_NORM" = "[]" ]) && \
             ([ -z "$SYNCED_NORM" ] || [ "$SYNCED_NORM" = "[]" ]); then
            echo "PASS: action succeeded with custom config path and produced empty outputs"
          else
            echo "FAIL: unexpected outputs: pull_request_urls=$PR_URLS synced_files=$SYNCED"
            exit 1
          fi
