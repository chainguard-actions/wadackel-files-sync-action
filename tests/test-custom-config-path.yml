name: Test custom config file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config at a custom path
        run: |
          mkdir -p custom/config/dir
          # Create a file to sync
          echo "# Test file" > test-sync-file.md
          # Config at a custom path referencing a non-existent target repo
          cat > custom/config/dir/sync.yaml << 'EOF'
          patterns:
            - files:
                - test-sync-file.md
              repositories:
                - actionchain-harness/nonexistent-test-repo-99999
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: custom/config/dir/sync.yaml

      - name: Assert action ran with custom config path (not a config-load error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail at the API call stage,
          # NOT at config loading (which would indicate the custom path was not found).
          # Both success and failure are acceptable here since the target repo is inaccessible.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom config path (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
