name: Test custom config file path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config at a custom path
        run: |
          mkdir -p my-custom-sync-dir
          cat > my-custom-sync-dir/sync.yaml << 'EOF'
          patterns: []
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          config_file: my-custom-sync-dir/sync.yaml

      - name: Assert action used the custom config path (did not fail due to missing config)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT fail with "Load config error" since the file exists.
          # It may succeed (empty patterns) or fail for another reason (e.g. API),
          # but a "Load config error" would indicate the custom path was not honored.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with custom config path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (not due to missing config file)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
