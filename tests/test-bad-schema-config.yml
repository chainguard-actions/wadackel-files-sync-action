name: Test config with bad schema (patterns not an array)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file with wrong type for patterns
        run: |
          mkdir -p tests/fixtures/bad-schema
          cat > tests/fixtures/bad-schema/files-sync-config.yaml << 'EOF'
          patterns: "this-should-be-an-array-not-a-string"
          EOF

      - name: Run action with bad schema config (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: tests/fixtures/bad-schema/files-sync-config.yaml

      - name: Assert action failed due to schema validation error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with bad schema config, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with bad schema config"
