name: Test basic usage with github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal sync config file
        run: |
          mkdir -p .github
          cat > .github/files-sync-config.yml << 'EOF'
          group:
            - files:
                - source: README.md
              repos:
                - owner/nonexistent-repo-for-testing
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          config_file: .github/files-sync-config.yml

      - name: Assert action ran (token input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have run (either success or failure due to fake token)
          # but not be skipped — this confirms the github_token input was accepted
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with github_token input"
