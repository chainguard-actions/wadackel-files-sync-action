name: Test basic usage with github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create minimal sync config file
        run: |
          mkdir -p .github
          cat > .github/files-sync-config.yml << 'EOF'
          repos:
            - repo: example-owner/example-repo
              files:
                - src: README.md
                  dest: README.md
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token-for-testing
          config_file: .github/files-sync-config.yml

      - name: Assert action ran (token input was accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should either succeed or fail due to invalid token/API error,
          # not due to missing required inputs. Either outcome is acceptable here.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with github_token input provided"
