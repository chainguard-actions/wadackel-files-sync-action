name: Test config references missing file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config referencing a non-existent file
        run: |
          mkdir -p .github
          cat > .github/files-sync-config-missing-file.yaml << 'EOF'
          patterns:
            - files:
                - this-file-does-not-exist.md
              repositories:
                - actionchain-harness/nonexistent-test-repo-12345
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/files-sync-config-missing-file.yaml

      - name: Assert action failed gracefully when sync file is missing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully when referenced sync file does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: expected action to fail when referenced sync file does not exist"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
