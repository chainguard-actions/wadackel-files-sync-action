name: Test file resolve error when source file missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config referencing a non-existent source file
        run: |
          mkdir -p tests/fixtures
          cat > tests/fixtures/missing-file-config.yml << 'EOF'
          patterns:
            - files:
                - nonexistent-source-file.txt
              repositories:
                - some-owner/some-repo
          EOF

      - name: Run action with config referencing missing source file
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: tests/fixtures/missing-file-config.yml

      - name: Assert action failed due to missing source file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when source file is missing, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when source file was missing"
