name: Test config referencing nonexistent file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config referencing a file that does not exist
        run: |
          mkdir -p .github
          cat > .github/files-sync-config-nofile.yaml << 'EOF'
          patterns:
            - files:
                - this-file-does-not-exist.txt
              repositories:
                - some-org/some-repo
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .github/files-sync-config-nofile.yaml

      - name: Assert action failed gracefully on missing source file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when source file does not exist"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when source file does not exist"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
