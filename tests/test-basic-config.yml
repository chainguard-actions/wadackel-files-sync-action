name: Test basic config loading
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: '1'
      GITHUB_RUN_NUMBER: '1'
      GITHUB_SERVER_URL: https://github.com
      GITHUB_WORKFLOW: test-workflow
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sync config file
        run: |
          mkdir -p .github
          cat > .github/files-sync-config.yml << 'EOF'
          patterns:
            - files:
                - README.md
              repositories:
                - test-owner/target-repo
          EOF

      - name: Run action (expect failure at API stage, not config stage)
        id: action
        uses: .
        with:
          github_token: fake-token-for-testing
        continue-on-error: true

      - name: Assert action failed at API stage (not config stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (fake token), but we verify it's not a config error
          # Config loading should succeed since we provided a valid config
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (fake token), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected (at API stage with fake token)"
