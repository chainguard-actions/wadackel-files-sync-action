name: Test bad YAML syntax in config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create config file with bad YAML syntax
        run: |
          mkdir -p .github
          # Write a file with invalid YAML (bad indentation / syntax)
          printf 'patterns:\n  - files: [unclosed\n' > .github/files-sync-bad.yml

      - name: Run action with bad YAML config (expect failure)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          config_file: .github/files-sync-bad.yml
        continue-on-error: true

      - name: Assert action failed due to bad YAML
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when config has bad YAML syntax, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when config file had bad YAML syntax"
